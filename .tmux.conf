# ===== Basic Settings =====
# Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Terminal and performance
set -g mouse off
# Foot advertises its own terminfo; do not force RGB on unrelated terminals.
set -as terminal-features ",foot*:RGB"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
# Refresh Wayland clipboard access when reattaching after a desktop restart.
set -ag update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on

# History
set -g history-limit 10000

# ===== Display =====
# Numbering
set -g base-index 1
setw -g pane-base-index 1

# Window behavior
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles off

# Display timing
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

# Activity
set -g monitor-activity on
set -g visual-activity off

# ===== Keybindings =====
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Window management
bind c new-window -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"
bind * split-window -h -c "#{pane_current_path}"

# Window navigation (keep your existing bindings)
unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Pane navigation (vi-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (essential missing feature)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane management
bind x confirm-before -p "Close pane #P? (y/n)" kill-pane
bind z resize-pane -Z  # zoom toggle
bind Space next-layout

# Quick window switching
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5

# Session management
bind S choose-session
bind N new-session

# ===== Copy Mode =====
set-window-option -g mode-keys vi
bind Enter copy-mode

# Copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# ===== Ink Status Bar =====
set -g status on
set -g status-style "bg=#16191F,fg=#E4E7EB"
set -g status-left-length 30
set -g status-right-length 35
set -g status-justify left
set -g status-left "#[fg=#79C0FF,bold] #S #[default] | "
set -g status-right "#{?client_prefix,#[fg=#FFD580] PREFIX ,}#{?window_zoomed_flag,#[fg=#A5E075] ZOOM ,}#[fg=#B8C0CC] %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#245782,fg=#FFFFFF,bold"
setw -g window-status-activity-style "fg=#A5E075,underscore"
setw -g window-status-bell-style "fg=#FF7B86,bold"
set -g pane-border-style "fg=#707984"
set -g pane-active-border-style "fg=#79C0FF"
set -g message-style "bg=#252A32,fg=#FFD580"
set -g mode-style "bg=#245782,fg=#FFFFFF"
