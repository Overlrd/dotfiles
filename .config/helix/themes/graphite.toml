# Silver interface; filename retained so existing Helix config keeps working.
inherits = "base16_default_dark"

"ui.cursorline.primary" = { bg = "#343c45" }
"ui.linenr" = { fg = "#939da9", bg = "#292f36" }
"ui.linenr.selected" = { fg = "#ffffff", bg = "#343c45", modifiers = ["bold"] }
"ui.gutter" = { bg = "#292f36" }
"ui.statusline.inactive" = { fg = "#b0b8c2", bg = "#292f36" }
"ui.bufferline.active" = { fg = "#ffffff", bg = "#3b4550", modifiers = ["bold"] }

"ui.statusline" = { fg = "#242A31", bg = "#CDD2D8" }
"ui.menu.selected" = { fg = "#FFFFFF", bg = "#456B87" }

